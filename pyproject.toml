[project]
name = "veris"
version = "0.1.0"
description = "Local vision-to-speech description pipeline for an assistive wearable (demo harness)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "fastapi>=0.139.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "onnxscript>=0.7.2",
    "opencv-python-headless>=5.1.0.95",
    "peft>=0.19.1",
    "pillow>=12.3.0",
    "pycocotools>=2.0.11",
    "python-multipart>=0.0.32",
    "qwen-vl-utils[decord]>=0.0.14",
    "rapidocr>=3.10.0",
    "scipy>=1.18.1",
    "timm>=1.0.31",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "transformers>=5.13.0",
    "uvicorn>=0.50.0",
]

[project.scripts]
veris = "veris.cli:main"

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
