# LLaMA-Factory QLoRA config — Veris 3B describer (the training recipe)
# Run: cd ~/LLaMA-Factory && .venv/bin/llamafactory-cli train /path/to/veris/dataset/sft/qlora_3b.yaml
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
image_max_pixels: 602112           # ~768px budget, matches deployment
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_target: all                   # LLM attention+MLP; vision tower frozen below
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
freeze_vision_tower: true          # keeps mmproj unchanged for GGUF reuse
freeze_multi_modal_projector: false  # merger trains (spatial mapping lives here)

# 4-bit base = QLoRA; the 3070 has 8GB
quantization_bit: 4
double_quantization: true

dataset_dir: /path/to/veris/dataset/sft
dataset: veris_sft
template: qwen2_vl
cutoff_len: 2048

output_dir: /path/to/veris/dataset/sft/out-qlora-3b
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
logging_steps: 5
save_steps: 200
plot_loss: true
report_to: none
